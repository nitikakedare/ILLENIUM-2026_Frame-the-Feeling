<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frame the Feeling – Spin the Wheel</title>
<style>
  :root{
    --purple:#3B006B; --lav:#CBA6F7; --white:#FFFFFF;
    --wheel:min(76vh, 54vw);
    --font:"Segoe UI","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:var(--font); color:var(--white);
    background:
      radial-gradient(ellipse 60% 70% at 50% 52%, rgba(59,0,107,.55) 0%, rgba(59,0,107,0) 70%),
      linear-gradient(160deg,#050007 0%,#0a0212 45%,#14052a 100%);
    background-color:#050007;
  }
  h1{
    position:absolute; top:4.5vh; left:4vw; max-width:60vw;
    font-size:clamp(1.2rem,2vw,2.6rem); line-height:1.15; font-weight:400; letter-spacing:0; white-space:nowrap;
  }
  h1 b{display:block;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
  .counter{
    position:absolute; top:5vh; right:4vw;
    font-size:clamp(.8rem,1vw,1.2rem); font-weight:600; letter-spacing:.14em; color:var(--lav);
  }

  /* wheel */
  .stage{
    position:absolute; left:50%; top:47%; transform:translate(-50%,-50%);
    width:var(--wheel); height:var(--wheel);
  }
  #wheel{
    width:100%; height:100%; display:block; cursor:pointer; border-radius:50%;
    filter:drop-shadow(0 18px 40px rgba(0,0,0,.65)) drop-shadow(0 0 60px rgba(59,0,107,.7));
  }
  #wheel.off{cursor:default}
  .pointer{
    position:absolute; right:-3.2%; top:50%; width:7%; height:9%;
    transform:translateY(-50%); background:var(--white);
    clip-path:polygon(0 50%,100% 0,100% 100%);
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));
  }

  /* result */
  .result{
    position:absolute; left:4vw; top:50%; transform:translateY(-50%); width:24vw;
  }
  .result .label{
    font-size:clamp(.75rem,.95vw,1.15rem); font-weight:600; letter-spacing:.16em; color:var(--lav); margin-bottom:1.2vh;
  }
  .result .value{
    font-size:clamp(1.8rem,3.4vw,4.4rem); line-height:1.05; font-weight:800; letter-spacing:-.02em; overflow-wrap:anywhere;
  }
  .result .value.idle{font-weight:300;color:rgba(255,255,255,.4);font-size:clamp(1.2rem,1.8vw,2.2rem);letter-spacing:0}
  .result .value.reveal{animation:reveal .7s cubic-bezier(.2,.8,.2,1)}
  @keyframes reveal{from{opacity:0;transform:scale(.88);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}

  /* controls */
  .controls{
    position:absolute; left:50%; bottom:3.5vh; transform:translateX(-50%);
    display:flex; gap:1.2vw; white-space:nowrap;
  }
  button{
    font-family:var(--font); font-weight:700; letter-spacing:.1em;
    font-size:clamp(.75rem,.95vw,1.1rem); padding:1.4vh 1.8vw; border-radius:999px; cursor:pointer;
    border:1.5px solid var(--lav); background:transparent; color:var(--white);
    transition:background .2s,color .2s,opacity .2s,transform .1s;
  }
  button:hover:not(:disabled){background:rgba(203,166,247,.16)}
  button:active:not(:disabled){transform:scale(.97)}
  button.primary{background:var(--white);color:var(--purple);border-color:var(--white)}
  button.primary:hover:not(:disabled){background:var(--lav)}
  button:disabled{opacity:.3;cursor:not-allowed}
  :focus-visible{outline:3px solid var(--lav);outline-offset:3px}

  #confirmBox{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(5,0,7,.75); z-index:20;
  }
  #confirmBox.open{display:flex}
  #confirmBox .card{
    background:#14052a; border:1px solid rgba(203,166,247,.45); border-radius:16px;
    padding:32px 36px; max-width:min(480px,90vw); text-align:center;
  }
  #confirmBox p{font-size:1.15rem;line-height:1.4;margin-bottom:24px}
  #confirmBox .row{justify-content:center}
  #confirmBox .row button{padding:12px 26px;font-size:.85rem}

  /* admin */
  #admin{
    position:fixed; top:0; right:0; height:100%; width:min(380px,90vw);
    background:rgba(12,2,24,.97); border-left:1px solid rgba(203,166,247,.35);
    padding:24px; display:none; flex-direction:column; gap:14px; z-index:10; overflow:auto;
  }
  #admin.open{display:flex}
  #admin h2{font-size:1.1rem;letter-spacing:.1em;color:var(--lav)}
  #admin small{color:rgba(255,255,255,.55)}
  .row{display:flex;gap:8px}
  .row input,#newOpt{
    flex:1; min-width:0; padding:10px 12px; border-radius:8px; border:1px solid rgba(203,166,247,.5);
    background:#1b0833; color:#fff; font-family:var(--font); font-size:.95rem;
  }
  .row button{padding:8px 12px;font-size:.75rem;letter-spacing:.05em}

  @media (max-width:900px){
    h1{white-space:normal;max-width:80vw}
    .result{left:50%;top:auto;bottom:14vh;transform:translateX(-50%);width:80vw;text-align:center}
    .stage{top:40%}
    .controls{flex-wrap:wrap;justify-content:center;width:95vw;white-space:normal}
  }
  @media (prefers-reduced-motion:reduce){.result .value.reveal{animation:none}}
</style>
</head>
<body>

<h1><b>VISUAL ELEMENT</b> of Frame the Feeling</h1>
<div class="counter" id="counter" aria-live="polite"></div>

<div class="stage">
  <canvas id="wheel" role="button" tabindex="0" aria-label="Spin the wheel"></canvas>
  <div class="pointer"></div>
</div>

<div class="result" aria-live="polite">
  <div class="label" id="resLabel">SELECTED VISUAL ELEMENT</div>
  <div class="value idle" id="resValue">Spin to reveal</div>
</div>

<div class="controls">
  <button class="primary" id="spinBtn">SPIN</button>
  <button id="removeBtn" disabled>REMOVE SELECTED OPTION</button>
  <button id="resetBtn">RESET WHEEL</button>
</div>

<div id="confirmBox" role="dialog" aria-modal="true">
  <div class="card">
    <p>Reset the wheel? All three original options will be restored and the current progress will be lost.</p>
    <div class="row">
      <button class="primary" id="confirmYes">YES, RESET</button>
      <button id="confirmNo">CANCEL</button>
    </div>
  </div>
</div>

<aside id="admin" aria-label="Admin panel">
  <h2>ADMIN – OPTIONS</h2>
  <small>Ctrl + Shift + A to close. Changes apply to the current wheel only; Reset restores the original three.</small>
  <div id="adminList" style="display:flex;flex-direction:column;gap:8px"></div>
  <div class="row">
    <input id="newOpt" placeholder="New option">
    <button id="addBtn">ADD</button>
  </div>
</aside>

<script>
(function(){
  const COLORS = {
    purple:{fill:"#3B006B", text:"#FFFFFF"},
    lav:{fill:"#CBA6F7", text:"#3B006B"},
    white:{fill:"#FFFFFF", text:"#3B006B"}
  };
  const ORDER = ["purple","lav","white"];
  const DEFAULTS = ["DAASTAN-E-ILLENIUM","SPIN AND SWING","FLEA STALLS"];
  const TAU = Math.PI*2;
  const mod = (a,b)=>((a%b)+b)%b;

  let options = DEFAULTS.slice();
  let rot = 0;            // clockwise rotation of wheel in radians
  let spinning = false;
  let selected = null;    // index into options of the landed segment

  const canvas = document.getElementById("wheel");
  const ctx = canvas.getContext("2d");
  const spinBtn = document.getElementById("spinBtn");
  const removeBtn = document.getElementById("removeBtn");
  const resetBtn = document.getElementById("resetBtn");
  const counter = document.getElementById("counter");
  const resLabel = document.getElementById("resLabel");
  const resValue = document.getElementById("resValue");

  /* ---------- segment colours: no two neighbours match (incl. last/first) ---------- */
  function segmentColors(n){
    const out = [];
    for(let i=0;i<n;i++){
      const banned = new Set();
      if(i>0) banned.add(out[i-1]);
      if(i===n-1 && n>1) banned.add(out[0]);
      let pick = ORDER[i%3];
      if(banned.has(pick)) pick = ORDER.find(c=>!banned.has(c));
      out.push(pick);
    }
    return out;
  }

  /* ---------- drawing ---------- */
  function fitLabel(text, maxW, maxH, startSize){
    // try one line, then two lines, shrinking font until it fits
    for(let size=startSize; size>=10; size-=1){
      ctx.font = `800 ${size}px "Segoe UI","Helvetica Neue",Arial,sans-serif`;
      if(size*1.1 <= maxH && ctx.measureText(text).width <= maxW) return {lines:[text],size};
      const words = text.split(/(?<=-)|\s+/).filter(Boolean);
      const join = arr => arr.reduce((acc,w,i)=> i===0 ? w : acc + (acc.endsWith("-") ? "" : " ") + w, "");
      if(words.length>1){
        let best=null;
        for(let k=1;k<words.length;k++){
          const a=join(words.slice(0,k)), b=join(words.slice(k));
          const w=Math.max(ctx.measureText(a).width, ctx.measureText(b).width);
          if(!best||w<best.w) best={a,b,w};
        }
        if(size*2.2 <= maxH && best.w <= maxW) return {lines:[best.a,best.b],size};
      }
    }
    return {lines:[text],size:10};
  }

  function draw(){
    const dpr = window.devicePixelRatio||1;
    const css = canvas.clientWidth;
    if(canvas.width !== Math.round(css*dpr)){ canvas.width = canvas.height = Math.round(css*dpr); }
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,css,css);

    const cx = css/2, cy = css/2, R = css/2 - 6;
    const n = options.length;
    if(n===0){
      ctx.beginPath(); ctx.arc(cx,cy,R,0,TAU); ctx.fillStyle="#1b0833"; ctx.fill();
      ctx.lineWidth=6; ctx.strokeStyle="#fff"; ctx.stroke();
      drawHub(cx,cy,R);
      return;
    }
    const arc = TAU/n;
    const cols = segmentColors(n);

    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(rot);

    // segments
    for(let i=0;i<n;i++){
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.arc(0,0,R,i*arc,(i+1)*arc);
      ctx.closePath();
      ctx.fillStyle = COLORS[cols[i]].fill;
      ctx.fill();
      if(n>1){ ctx.lineWidth=1.5; ctx.strokeStyle="rgba(59,0,107,.35)"; ctx.stroke(); }
    }
    // soft inner shading for depth
    const g = ctx.createRadialGradient(0,0,R*.1,0,0,R);
    g.addColorStop(0,"rgba(0,0,0,.25)"); g.addColorStop(.5,"rgba(0,0,0,0)"); g.addColorStop(1,"rgba(0,0,0,.18)");
    ctx.beginPath(); ctx.arc(0,0,R,0,TAU); ctx.fillStyle=g; ctx.fill();

    // labels
    for(let i=0;i<n;i++){
      ctx.save();
      ctx.rotate((i+.5)*arc);
      const r0 = R*.30, r1 = R*.93;
      const maxW = r1-r0;
      const chord = n>1 ? 2*Math.sin(Math.min(arc,Math.PI)/2)*(R*.5)*.82 : R;
      const fit = fitLabel(options[i], maxW, chord, Math.round(R*.095));
      ctx.font = `800 ${fit.size}px "Segoe UI","Helvetica Neue",Arial,sans-serif`;
      ctx.fillStyle = COLORS[cols[i]].text;
      ctx.textAlign = "right"; ctx.textBaseline = "middle";
      const lh = fit.size*1.08;
      fit.lines.forEach((ln,k)=>{
        ctx.fillText(ln, r1, (k-(fit.lines.length-1)/2)*lh);
      });
      ctx.restore();
    }
    ctx.restore();

    // outer ring
    ctx.beginPath(); ctx.arc(cx,cy,R,0,TAU); ctx.lineWidth=6; ctx.strokeStyle="#FFFFFF"; ctx.stroke();
    drawHub(cx,cy,R);
  }

  function drawHub(cx,cy,R){
    const hr = R*.17;
    ctx.save();
    ctx.shadowColor="rgba(0,0,0,.5)"; ctx.shadowBlur=18; ctx.shadowOffsetY=4;
    ctx.beginPath(); ctx.arc(cx,cy,hr,0,TAU); ctx.fillStyle="#FFFFFF"; ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.arc(cx,cy,hr*.84,0,TAU); ctx.fillStyle="#3B006B"; ctx.fill();
    ctx.fillStyle="#FFFFFF"; ctx.textAlign="center"; ctx.textBaseline="middle";
    const s = Math.round(hr*.30);
    ctx.font = `800 ${s}px "Segoe UI","Helvetica Neue",Arial,sans-serif`;
    const canSpin = !spinning && options.length>1;
    const txt = options.length>1 ? ["CLICK","TO SPIN"] : ["—"];
    txt.forEach((t,i)=> ctx.fillText(t, cx, cy + (i-(txt.length-1)/2)*s*1.15));
  }

  /* ---------- state / UI ---------- */
  function winnerIndex(){
    const n = options.length;
    // pointer sits at angle 0 (right); in wheel space that is angle -rot
    return Math.floor(mod(-rot, TAU) / (TAU/n)) % n;
  }

  function showResult(label, value, animate){
    resLabel.textContent = label;
    resValue.textContent = value;
    resValue.classList.remove("idle","reveal");
    if(animate){ void resValue.offsetWidth; resValue.classList.add("reveal"); }
  }
  function showIdle(msg){
    resLabel.textContent = "SELECTED VISUAL ELEMENT";
    resValue.textContent = msg;
    resValue.classList.remove("reveal"); resValue.classList.add("idle");
  }

  function refreshUI(){
    const n = options.length;
    counter.textContent = `${n} OPTION${n===1?"":"S"} REMAINING`;
    spinBtn.disabled = spinning || n<2;
    removeBtn.disabled = spinning || selected===null || n<2;
    resetBtn.disabled = spinning;
    canvas.classList.toggle("off", spinning || n<2);
    canvas.setAttribute("aria-disabled", spinning || n<2);
    draw();
  }

  function refreshResult(animate){
    const n = options.length;
    if(selected!==null){ showResult("SELECTED VISUAL ELEMENT", options[selected], animate); return; }
    if(n===0){ showIdle("No options left"); return; }
    if(n===1){ showResult("FINAL OPTION", options[0], animate); return; }
    showIdle("Spin to reveal");
  }

  /* ---------- spinning ---------- */
  function spin(){
    if(spinning || options.length<2) return;
    spinning = true; selected = null;
    showIdle("Spinning…");
    refreshUI();

    const n = options.length, arc = TAU/n;
    const target = Math.floor(Math.random()*n);
    const jitter = (Math.random()-.5)*arc*.7;               // stay inside the segment
    const targetRot = -((target+.5)*arc + jitter);          // puts that segment under the pointer
    const start = rot;
    const turns = 5 + Math.floor(Math.random()*4);          // 5–8 full rotations
    const delta = mod(targetRot-start, TAU) + turns*TAU;
    const dur = 6000 + Math.random()*1500;
    const t0 = performance.now();

    function frame(now){
      const t = Math.min(1,(now-t0)/dur);
      const e = 1 - Math.pow(1-t,4);                        // fast start, slow finish
      rot = start + delta*e;
      draw();
      if(t<1){ requestAnimationFrame(frame); }
      else{
        rot = start + delta;
        spinning = false;
        selected = winnerIndex();                           // read result from actual wheel position
        refreshResult(true);
        refreshUI();
      }
    }
    requestAnimationFrame(frame);
  }

  function removeSelected(){
    if(spinning || selected===null || options.length<2) return;
    options.splice(selected,1);
    selected = null; rot = 0;
    refreshResult(true);
    refreshUI();
    renderAdmin();
  }

  const confirmBox = document.getElementById("confirmBox");
  function askReset(){
    if(spinning) return;
    confirmBox.classList.add("open");
    document.getElementById("confirmNo").focus();
  }
  function resetWheel(){
    confirmBox.classList.remove("open");
    if(spinning) return;
    options = DEFAULTS.slice();
    selected = null; rot = 0;
    refreshResult(false);
    refreshUI();
    renderAdmin();
  }

  spinBtn.addEventListener("click", spin);
  canvas.addEventListener("click", spin);
  canvas.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); spin(); }});
  removeBtn.addEventListener("click", removeSelected);
  resetBtn.addEventListener("click", askReset);
  document.getElementById("confirmYes").addEventListener("click", resetWheel);
  document.getElementById("confirmNo").addEventListener("click", ()=>confirmBox.classList.remove("open"));
  window.addEventListener("keydown", e=>{ if(e.key==="Escape") confirmBox.classList.remove("open"); });
  window.addEventListener("resize", draw);

  /* ---------- admin panel ---------- */
  const admin = document.getElementById("admin");
  const adminList = document.getElementById("adminList");
  const newOpt = document.getElementById("newOpt");

  function adminChanged(){
    selected = null; rot = 0;
    refreshResult(false);
    refreshUI();
    renderAdmin();
  }
  function renderAdmin(){
    adminList.innerHTML = "";
    if(!options.length){
      const p=document.createElement("small"); p.textContent="No options. Add one below."; adminList.appendChild(p);
    }
    options.forEach((o,i)=>{
      const row=document.createElement("div"); row.className="row";
      const inp=document.createElement("input"); inp.value=o; inp.disabled=spinning;
      inp.addEventListener("change",()=>{
        const v=inp.value.trim().toUpperCase();
        if(!v||spinning){ inp.value=options[i]; return; }
        options[i]=v; adminChanged();
      });
      const del=document.createElement("button"); del.textContent="REMOVE"; del.disabled=spinning;
      del.addEventListener("click",()=>{ if(spinning) return; options.splice(i,1); adminChanged(); });
      row.append(inp,del); adminList.appendChild(row);
    });
  }
  function addOption(){
    const v = newOpt.value.trim().toUpperCase();
    if(!v||spinning) return;
    options.push(v); newOpt.value=""; adminChanged();
  }
  document.getElementById("addBtn").addEventListener("click", addOption);
  newOpt.addEventListener("keydown", e=>{ if(e.key==="Enter") addOption(); });

  window.addEventListener("keydown", e=>{
    if(e.ctrlKey && e.shiftKey && e.key.toLowerCase()==="a"){
      e.preventDefault();
      admin.classList.toggle("open");
      if(admin.classList.contains("open")) renderAdmin();
    }
  });

  /* ---------- init ---------- */
  refreshResult(false);
  refreshUI();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
